<div id="root"></div>
<script>
// Persistence via the browser's localStorage
window.storage = {
  get: async function(k){ return { key:k, value: localStorage.getItem("larder-store:"+k) }; },
  set: async function(k,v){ localStorage.setItem("larder-store:"+k, v); return { key:k, value:v }; },
  "delete": async function(k){ localStorage.removeItem("larder-store:"+k); return { key:k, deleted:true }; },
  list: async function(){ return { keys: [] }; }
};
</script>
